# Generated by dock-local
global:
  scrape_interval: 10s
scrape_configs:
  - job_name: app
    metrics_path: {{env.APP_METRICS_PATH}}
    static_configs:
      - targets: ["host.docker.internal:{{env.APP_PORT}}"]
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
{{#if services.otel_collector}}
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
{{/if}}
