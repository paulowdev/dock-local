# Generated by dock-local
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
processors:
  batch: {}
exporters:
  debug:
    verbosity: basic
{{#if services.jaeger}}
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true
{{/if}}
{{#if services.prometheus}}
  prometheus:
    endpoint: 0.0.0.0:8889
{{/if}}
service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug{{#if services.jaeger}}, otlp/jaeger{{/if}}]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug{{#if services.prometheus}}, prometheus{{/if}}]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
