- id: keycloak
  name: Keycloak (OAuth2 / OIDC issuer)
  category: security
  kind: service
  aliases: [rh-sso, oauth2, oidc, sso]
  summary: Keycloak in dev mode with a pre-imported realm, client and user (dev/dev) for token flows.
  detect:
    dependencies:
      - org.keycloak:*
      - "*:spring-boot-starter-oauth2-resource-server"
      - "*:spring-boot-starter-oauth2-client"
      - "*:spring-security-oauth2-jose"
      - "*:quarkus-oidc"
      - keycloak-js
      - keycloak-connect
      - "@react-keycloak/web"
      - passport-keycloak-oauth2-oidc
      - python-keycloak
      - Keycloak.AuthServices.Authentication
    patterns:
      - "issuer-uri|issuer_uri|issuerUri"
      - "jwk-set-uri|jwks_uri|jwksUri"
      - "\\bkeycloak\\b"
      - "rh-?sso|redhat-sso"
      - "realms/[a-zA-Z0-9_-]+/protocol/openid-connect"
    env: [KEYCLOAK_, OAUTH2_, OIDC_]
  extract:
    realms: "realms/(?<v>[a-zA-Z][a-zA-Z0-9_-]{1,63})(?:/|\\b)"
    oauth_clients: "client-?id[ \\t]*[:=][ \\t]*[\"']?(?<v>[a-zA-Z][a-zA-Z0-9._-]{2,100})"
  env:
    KEYCLOAK_PORT: "8180"
    KEYCLOAK_ADMIN: admin
    KEYCLOAK_ADMIN_PASSWORD: admin
    KEYCLOAK_REALM: dock
    KEYCLOAK_CLIENT_ID: app
    KEYCLOAK_CLIENT_SECRET: dock-secret
  compose:
    image: keycloak/keycloak:25.0
    command: ["start-dev", "--import-realm", "--http-port=8080"]
    ports: ["${KEYCLOAK_PORT}:8080"]
    environment:
      KEYCLOAK_ADMIN: "${KEYCLOAK_ADMIN}"
      KEYCLOAK_ADMIN_PASSWORD: "${KEYCLOAK_ADMIN_PASSWORD}"
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./init/keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q 200"]
      interval: 10s
      timeout: 5s
      retries: 30
  seeds:
    - path: init/keycloak/dock-realm.json
      template: keycloak/realm.json
  appEnv:
    SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: "http://localhost:${KEYCLOAK_PORT}/realms/${KEYCLOAK_REALM}"
    OAUTH2_ISSUER_URI: "http://localhost:${KEYCLOAK_PORT}/realms/${KEYCLOAK_REALM}"
    OAUTH2_CLIENT_ID: "${KEYCLOAK_CLIENT_ID}"
    OAUTH2_CLIENT_SECRET: "${KEYCLOAK_CLIENT_SECRET}"
    KEYCLOAK_URL: "http://localhost:${KEYCLOAK_PORT}"
  notes: "Get a token: curl -d 'grant_type=password&client_id=app&client_secret=dock-secret&username=dev&password=dev' http://localhost:8180/realms/dock/protocol/openid-connect/token"

- id: vault
  name: HashiCorp Vault
  summary: Vault in dev mode with a root token (KV v2 enabled at secret/).
  category: security
  kind: service
  detect:
    dependencies:
      - "*:spring-cloud-starter-vault-config"
      - "*:spring-vault-core"
      - com.bettercloud:vault-java-driver
      - io.github.jopenlibs:vault-java-driver
      - node-vault
      - hvac
      - github.com/hashicorp/vault/api
      - VaultSharp
    patterns: ["spring\\.cloud\\.vault", "VAULT_ADDR", "\\bvault\\.[a-z0-9.-]+:8200"]
  env:
    VAULT_PORT: "8200"
    VAULT_TOKEN: root
  compose:
    image: hashicorp/vault:1.17
    ports: ["${VAULT_PORT}:8200"]
    cap_add: [IPC_LOCK]
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: "${VAULT_TOKEN}"
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    healthcheck:
      test: ["CMD", "vault", "status", "-address=http://127.0.0.1:8200"]
      interval: 5s
      timeout: 3s
      retries: 20
  appEnv:
    VAULT_ADDR: "http://localhost:${VAULT_PORT}"
    VAULT_TOKEN: "${VAULT_TOKEN}"
    SPRING_CLOUD_VAULT_URI: "http://localhost:${VAULT_PORT}"
    SPRING_CLOUD_VAULT_TOKEN: "${VAULT_TOKEN}"

- id: spring-cloud-config
  name: Spring Cloud Config
  category: security
  kind: report-only
  detect:
    dependencies: ["*:spring-cloud-starter-config", "*:spring-cloud-config-client"]
    patterns: ["spring\\.cloud\\.config\\.(uri|enabled)", "configserver:"]
  notes: Disable the remote config client locally (`spring.cloud.config.enabled=false` / `spring.config.import=optional:configserver:`) and use an application-local profile fed by .dock/app.env.

- id: azure-keyvault
  name: Azure Key Vault
  category: security
  kind: report-only
  detect:
    dependencies: [com.azure:azure-security-keyvault-secrets, "*:spring-cloud-azure-starter-keyvault*", "@azure/keyvault-secrets", azure-keyvault-secrets, Azure.Security.KeyVault.Secrets]
    patterns: ["vault\\.azure\\.net"]
  notes: No local emulator; inject the same secrets as environment variables locally.
