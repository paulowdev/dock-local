- id: kafka
  name: Apache Kafka / MSK
  category: messaging
  kind: service
  aliases: [msk, aws-msk, confluent, event-hubs]
  summary: Kafka 3.8 (KRaft, no ZooKeeper) with topics pre-created; MSK and Event Hubs (Kafka protocol) map here.
  companions: [kafka-ui, kafka-init]
  detect:
    dependencies:
      - org.springframework.kafka:spring-kafka
      - org.apache.kafka:*
      - "*:spring-cloud-stream-binder-kafka*"
      - "*:quarkus-smallrye-reactive-messaging-kafka"
      - "*:quarkus-kafka-client"
      - "*:quarkus-messaging-kafka"
      - io.projectreactor.kafka:reactor-kafka
      - software.amazon.msk:aws-msk-iam-auth
      - "*kafka-starter*"
      - kafkajs
      - node-rdkafka
      - "@confluentinc/kafka-javascript"
      - confluent-kafka
      - kafka-python
      - aiokafka
      - faust-streaming
      - github.com/segmentio/kafka-go
      - github.com/confluentinc/confluent-kafka-go*
      - github.com/IBM/sarama
      - Confluent.Kafka
    patterns:
      - "bootstrap[-._]servers"
      - "kafka\\.[a-z0-9-]+\\.amazonaws\\.com"
      - "@KafkaListener"
      - "KafkaTemplate"
      - "\\bmsk\\b"
      - "servicebus\\.windows\\.net:9093"
    env: [KAFKA_, SPRING_KAFKA]
  extract:
    topics: "(?:@KafkaListener\\s*\\([^)]*topics\\s*=\\s*\\{?\\s*\"|(?:\\btopic(?:s|-name|Name|_name)?|destination|[\\w-]*[-_.]topic)[ \\t]*[:=][ \\t]*[\"']?)(?<v>[a-zA-Z][a-zA-Z0-9._-]{2,200})|\\btopics:[ \\t]*\\n(?<block>(?:[ \\t]+(?:-[ \\t]*|[\\w.-]+[ \\t]*:[ \\t]*)[^\\n]+\\n?)+)"
  env:
    KAFKA_PORT: "9092"
    KAFKA_UI_PORT: "8089"
  compose:
    image: apache/kafka:3.8.0
    ports: ["${KAFKA_PORT}:9092"]
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:${KAFKA_PORT},INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_NUM_PARTITIONS: "3"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
  appEnv:
    SPRING_KAFKA_BOOTSTRAP_SERVERS: "localhost:${KAFKA_PORT}"
    KAFKA_BOOTSTRAP_SERVERS: "localhost:${KAFKA_PORT}"
    KAFKA_BROKERS: "localhost:${KAFKA_PORT}"
  appEnvInternal:
    SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    KAFKA_BROKERS: kafka:29092
  notes: MSK IAM auth must be disabled locally (use PLAINTEXT, no `security.protocol=SASL_SSL`).

- id: kafka-init
  name: Kafka topics seed
  category: messaging
  kind: service
  requires: [kafka]
  summary: One-shot job creating the topics found in the project.
  compose:
    image: apache/kafka:3.8.0
    restart: "no"
    depends_on:
      kafka: { condition: service_healthy }
    entrypoint: ["/bin/bash", "/init/create-topics.sh"]
    volumes:
      - ./init/kafka:/init:ro
  seeds:
    - path: init/kafka/create-topics.sh
      template: kafka/create-topics.sh
      executable: true

- id: kafka-ui
  name: Kafka UI
  category: messaging
  kind: service
  requires: [kafka]
  summary: Web UI for topics, consumers and messages.
  compose:
    image: provectuslabs/kafka-ui:v0.7.2
    ports: ["${KAFKA_UI_PORT}:8080"]
    depends_on:
      kafka: { condition: service_healthy }
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      DYNAMIC_CONFIG_ENABLED: "true"
  appEnv:
    KAFKA_UI_URL: "http://localhost:${KAFKA_UI_PORT}"

- id: schema-registry
  name: Confluent Schema Registry
  summary: Confluent Schema Registry for Avro/Protobuf/JSON schemas (needs kafka).
  category: messaging
  kind: service
  requires: [kafka]
  aliases: [avro, glue-schema-registry]
  detect:
    dependencies:
      - io.confluent:kafka-schema-registry-client
      - io.confluent:kafka-avro-serializer
      - io.confluent:kafka-protobuf-serializer
      - io.confluent:kafka-json-schema-serializer
      - software.amazon.glue:schema-registry-serde
      - "@kafkajs/confluent-schema-registry"
      - confluent-kafka[avro]
    patterns:
      - "schema[-._]registry"
      - "SpecificAvroSerde"
  env:
    SCHEMA_REGISTRY_PORT: "8081"
  compose:
    image: confluentinc/cp-schema-registry:7.7.1
    ports: ["${SCHEMA_REGISTRY_PORT}:8081"]
    depends_on:
      kafka: { condition: service_healthy }
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:29092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/subjects || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
  appEnv:
    SPRING_KAFKA_PROPERTIES_SCHEMA_REGISTRY_URL: "http://localhost:${SCHEMA_REGISTRY_PORT}"
    SCHEMA_REGISTRY_URL: "http://localhost:${SCHEMA_REGISTRY_PORT}"

- id: debezium
  name: Debezium Connect (CDC)
  summary: Kafka Connect with Debezium connectors for change-data-capture.
  category: messaging
  kind: service
  aliases: [cdc, kafka-connect]
  requires: [kafka]
  detect:
    dependencies: ["io.debezium:*"]
    patterns: ["debezium", "kafka[-_]connect"]
  env:
    DEBEZIUM_PORT: "8083"
  compose:
    image: debezium/connect:2.7
    ports: ["${DEBEZIUM_PORT}:8083"]
    depends_on:
      kafka: { condition: service_healthy }
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      GROUP_ID: dock-connect
      CONFIG_STORAGE_TOPIC: _connect_configs
      OFFSET_STORAGE_TOPIC: _connect_offsets
      STATUS_STORAGE_TOPIC: _connect_status
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
  appEnv:
    KAFKA_CONNECT_URL: "http://localhost:${DEBEZIUM_PORT}"
  notes: Register connectors with `curl -X POST localhost:8083/connectors -H 'Content-Type:application/json' -d @connector.json` (source DB must be a dock service).

- id: rabbitmq
  name: RabbitMQ / AmazonMQ
  category: messaging
  kind: service
  aliases: [amqp, amazonmq]
  summary: RabbitMQ 3.13 with management UI; queues from the project are declared at boot.
  detect:
    dependencies:
      - "*:spring-boot-starter-amqp"
      - org.springframework.amqp:*
      - com.rabbitmq:amqp-client
      - "*:spring-cloud-stream-binder-rabbit*"
      - amqplib
      - amqp-connection-manager
      - rascal
      - pika
      - aio-pika
      - kombu
      - github.com/rabbitmq/amqp091-go
      - github.com/streadway/amqp
      - RabbitMQ.Client
    patterns:
      - "\\bamqps?://"
      - "spring\\.rabbitmq"
      - "@RabbitListener"
      - "mq\\.[a-z0-9-]+\\.amazonaws\\.com:5671"
    env: [RABBITMQ_, RABBIT_, AMQP_]
  extract:
    rabbit_queues: "(?:@RabbitListener\\s*\\([^)]*queues\\s*=\\s*\\{?\\s*\"|assertQueue\\([ \\t]*[\"']|\\bqueue(?:-name|Name|_name)?[ \\t]*[:=][ \\t]*[\"']?)(?<v>[a-zA-Z][a-zA-Z0-9._-]{2,200})|\\bqueues:[ \\t]*\\n(?<block>(?:[ \\t]+(?:-[ \\t]*|[\\w.-]+[ \\t]*:[ \\t]*)[^\\n]+\\n?)+)"
  env:
    RABBITMQ_PORT: "5672"
    RABBITMQ_UI_PORT: "15672"
    RABBITMQ_USER: guest
    RABBITMQ_PASSWORD: guest
  compose:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "${RABBITMQ_PORT}:5672"
      - "${RABBITMQ_UI_PORT}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_USER}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASSWORD}"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./init/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
      - ./init/rabbitmq/20-dock.conf:/etc/rabbitmq/conf.d/20-dock.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20
  seeds:
    - path: init/rabbitmq/definitions.json
      template: rabbitmq/definitions.json
    - path: init/rabbitmq/20-dock.conf
      template: rabbitmq/20-dock.conf
  appEnv:
    SPRING_RABBITMQ_HOST: localhost
    SPRING_RABBITMQ_PORT: "${RABBITMQ_PORT}"
    SPRING_RABBITMQ_USERNAME: "${RABBITMQ_USER}"
    SPRING_RABBITMQ_PASSWORD: "${RABBITMQ_PASSWORD}"
    AMQP_URL: "amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@localhost:${RABBITMQ_PORT}"
    RABBITMQ_UI_URL: "http://localhost:${RABBITMQ_UI_PORT}"

- id: ibm-mq
  name: IBM MQ
  category: messaging
  kind: service
  aliases: [mq, websphere-mq, ibmmq]
  summary: IBM MQ Advanced for Developers (queue manager QM1, DEV.* queues, linux/amd64).
  detect:
    dependencies:
      - com.ibm.mq:*
      - "*:mq-jms-spring-boot-starter"
      - ibmmq
      - pymqi
      - IBMMQDotnetClient
      - github.com/ibm-messaging/mq-golang*
    patterns:
      - "ibm\\.mq"
      - "\\bMQ_QMGR|queue-?manager|queueManager"
      - "\\bMQSeries\\b"
      - "\\bwmq\\b"
    env: [IBM_MQ_, MQ_]
  env:
    IBMMQ_PORT: "1414"
    IBMMQ_UI_PORT: "9443"
    IBMMQ_QMGR: QM1
    IBMMQ_APP_PASSWORD: passw0rd
    IBMMQ_ADMIN_PASSWORD: passw0rd
  compose:
    image: icr.io/ibm-messaging/mq:9.4.0.0-r3
    platform: linux/amd64
    ports:
      - "${IBMMQ_PORT}:1414"
      - "${IBMMQ_UI_PORT}:9443"
    environment:
      LICENSE: accept
      MQ_QMGR_NAME: "${IBMMQ_QMGR}"
      MQ_APP_PASSWORD: "${IBMMQ_APP_PASSWORD}"
      MQ_ADMIN_PASSWORD: "${IBMMQ_ADMIN_PASSWORD}"
    volumes:
      - ibmmq-data:/mnt/mqm
  appEnv:
    IBM_MQ_QUEUEMANAGER: "${IBMMQ_QMGR}"
    IBM_MQ_CHANNEL: DEV.APP.SVRCONN
    IBM_MQ_CONNNAME: "localhost(${IBMMQ_PORT})"
    IBM_MQ_USER: app
    IBM_MQ_PASSWORD: "${IBMMQ_APP_PASSWORD}"
  notes: Queues DEV.QUEUE.1..3 exist by default; add MQSC files to .dock/init/ibm-mq and mount to /etc/mqm for custom queues. Console at https://localhost:9443 (admin).

- id: activemq
  name: ActiveMQ Artemis (JMS)
  summary: ActiveMQ Artemis broker (JMS/AMQP/STOMP) with web console.
  category: messaging
  kind: service
  aliases: [artemis, jms]
  detect:
    dependencies:
      - "*:spring-boot-starter-artemis"
      - "*:spring-boot-starter-activemq"
      - org.apache.activemq:*
      - "*:quarkus-artemis-jms"
    patterns:
      - "tcp://[^\\s\"']+:61616"
      - "spring\\.(artemis|activemq)"
  env:
    ARTEMIS_PORT: "61616"
    ARTEMIS_UI_PORT: "8161"
    ARTEMIS_USER: artemis
    ARTEMIS_PASSWORD: artemis
  compose:
    image: apache/activemq-artemis:2.36.0
    ports:
      - "${ARTEMIS_PORT}:61616"
      - "${ARTEMIS_UI_PORT}:8161"
    environment:
      ARTEMIS_USER: "${ARTEMIS_USER}"
      ARTEMIS_PASSWORD: "${ARTEMIS_PASSWORD}"
      ANONYMOUS_LOGIN: "false"
  appEnv:
    SPRING_ARTEMIS_BROKER_URL: "tcp://localhost:${ARTEMIS_PORT}"
    SPRING_ARTEMIS_USER: "${ARTEMIS_USER}"
    SPRING_ARTEMIS_PASSWORD: "${ARTEMIS_PASSWORD}"

- id: azure-servicebus
  name: Azure Service Bus
  category: messaging
  kind: report-only
  detect:
    dependencies:
      - com.azure:azure-messaging-servicebus
      - "*:spring-cloud-azure-starter-servicebus*"
      - "@azure/service-bus"
      - azure-servicebus
      - Azure.Messaging.ServiceBus
    patterns: ["servicebus\\.windows\\.net"]
  notes: No lightweight emulator (the official one needs SQL Edge). Options - use a dev namespace, or abstract the broker and run `dock add rabbitmq` locally. Event Hubs (Kafka protocol) is covered by the local kafka.
