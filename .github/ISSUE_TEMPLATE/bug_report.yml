name: Bug Report
description: Report a bug or unexpected behavior
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this bug! Please fill out the form below to help us reproduce and fix the issue.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of the bug
      placeholder: What went wrong?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior
      placeholder: |
        1. Run `dock detect` in project X
        2. Execute `dock init -y --up`
        3. See error...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
      placeholder: The stack should start without errors
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened?
      placeholder: Container failed to start with error...
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Please provide your environment details
      value: |
        - OS: [e.g., macOS 14, Ubuntu 22.04, Windows 11]
        - Node.js version: [run `node -v`]
        - Docker version: [run `docker --version`]
        - Docker Compose version: [run `docker compose version`]
        - dock-local version: [run `dock --version`]
      render: markdown
    validations:
      required: true

  - type: textarea
    id: doctor-output
    attributes:
      label: "`dock doctor` Output"
      description: Please run `dock doctor` and paste the output
      render: shell
      placeholder: |
        ✔ docker cli Docker version 24.0.6
        ✔ docker daemon 24.0.6 linux/arm64
        ...

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs
      description: Any relevant log output (use `dock logs <service>`)
      render: shell
      placeholder: Paste logs here...

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any other context, screenshots, or information about the problem
      placeholder: Add any other context here...
